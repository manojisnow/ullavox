name: Release

# Publication is triggered only by a pushed, validated version tag.
# Use dockerhub-readme.yml for manual documentation updates.
on:
  push:
    tags:
      - 'v*.*.*'

# Required secrets (set in GitHub → Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME  →  dumanoj
#   DOCKERHUB_TOKEN     →  Docker Hub access token (Account Settings → Security)

# Least-privilege default; the `publish` job below elevates to contents:write
# for the jobs that actually need it (creating the GitHub Release).
permissions:
  contents: read

jobs:

  validate:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.policy.outputs.version }}
      minor: ${{ steps.policy.outputs.minor }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
      stable: ${{ steps.policy.outputs.stable }}
      tags: ${{ steps.policy.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a default-branch commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "::error::Release tag must point to a commit in default-branch history."
            exit 1
          fi
      - name: Test release tag policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_policy.py' -v
      - name: Validate event and derive publication tags
        id: policy
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: python3 scripts/release_policy.py "$RELEASE_TAG" --event "$RELEASE_EVENT" --ref-type "$RELEASE_REF_TYPE" --compose docker-compose.release.yml >> "$GITHUB_OUTPUT"

  # ── Quality gates (mirrors CI — must pass before publishing) ─────────────────

  hadolint:
    needs: validate
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Hadolint on Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  backend:
    needs: validate
    name: Java Backend Build & Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Build, test & quality gates
        run: |
          cd backend
          mvn clean verify
      - name: Upload static analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            backend/chatapp/target/checkstyle-result.xml
            backend/chatapp/target/pmd.xml
            backend/chatapp/target/spotbugsXml.xml
            backend/chatapp/target/jacoco.xml

  frontend:
    needs: validate
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run tests
        run: cd frontend && npm test -- --coverage
      - name: Build frontend
        run: cd frontend && npm run build

  # ── Publish to Docker Hub & create GitHub Release ────────────────────────────

  publish:
    name: Publish Docker Image & Create Release
    needs: [validate, hadolint, backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enables multi-platform builds and layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The validated policy owns all published aliases; metadata supplies labels.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: dumanoj/ullavox
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
          labels: |
            org.opencontainers.image.title=Ullavox
            org.opencontainers.image.description=AI chat application powered by Ollama

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ needs.validate.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Re-use cached layers from previous releases to speed up builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Description
        if: needs.validate.outputs.stable == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dumanoj/ullavox
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md

      - name: Prepare curated release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          if [ -f "$notes" ]; then
            cp "$notes" "$RUNNER_TEMP/ullavox-release-notes.md"
          else
            printf '## Install\n\nDownload the Compose file from https://github.com/manojisnow/ullavox/blob/%s/docker-compose.release.yml and run `docker compose -f docker-compose.ullavox.yml up -d`. See README.md for configuration instructions.\n' "$RELEASE_TAG" > "$RUNNER_TEMP/ullavox-release-notes.md"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          make_latest: ${{ needs.validate.outputs.stable }}
          files: docker-compose.release.yml
          generate_release_notes: true
          body_path: ${{ runner.temp }}/ullavox-release-notes.md
